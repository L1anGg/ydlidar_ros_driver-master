DWAPlannerROS:
  global_frame_id: odom
  # ===== 机器人运动学参数 =====
  acc_lim_x: 0.4            # 最大 x 加速度 m/s²
  acc_lim_y: 0.0            # 全向才用
  acc_lim_th: 0.5           # 最大角加速度 rad/s²

  max_vel_trans: 0.10       # 最大线速度 m/s
  min_vel_trans: -0.10        # 最小线速度 m/s
  max_vel_x: 0.25
  min_vel_x: 0.0            # 不倒退
  max_vel_y: 0.0            # 全向才用
  min_vel_y: 0.0

  max_vel_theta: 0.5        # 最大角速度 rad/s
  min_vel_theta: 0.0        # 最小角速度 rad/s

  holonomic_robot: false    # 差速底盘必须为 false

  # ===== 目标容差 =====
  yaw_goal_tolerance: 0.3   # ≈17°，麦轮转向精度有限，别设太小
  xy_goal_tolerance: 0.2    # 20 cm，必须大于停车距离
  latch_xy_goal_tolerance: true

  # 低于该速度直接当作 0，避免发出车做不到的微小指令
  #trans_stopped_vel: 0.05
  #theta_stopped_vel: 0.05

  # ===== 前向仿真 =====
  #sim_time: 3.7             # 预测时长 s
  #sim_granularity: 0.20    # 仿真步长 m
  #angular_sim_granularity: 0.125
  #vx_samples: 6
  vy_samples: 1
  #vtheta_samples: 20

  # ===== 轨迹评分 =====
  #meter_scoring: true       # 用米而不是格子评分
  #path_distance_bias: 64.0
  #goal_distance_bias: 48.0
  occdist_scale: 0.1
  #forward_point_distance: 0.15
  #stop_time_buffer: 0.2
  #scaling_speed: 0.25
  #max_scaling_factor: 0.2
  #penalize_negative_x: true
  #publish_cost_grid: false

  # ===== 防震荡 =====
  #oscillation_reset_dist: 0.05
