TebLocalPlannerROS:
 odom_topic: /odom

 teb_autosize: True
 dt_ref: 0.4
 dt_hysteresis: 0.1
 min_samples: 3
 global_plan_overwrite_orientation: False   #  不跟全局朝向，让TEB自己平滑
 max_global_plan_lookahead_dist: 2.5        #  1.5 -> 2.5
 feasibility_check_no_poses: 5
 oscillation_recovery: True

 max_vel_x: 0.35
 max_vel_x_backwards: 0.25    #  禁倒车，消除来回抖
 max_vel_theta: 1
 acc_lim_x: 0.15
 acc_lim_theta: 1

 min_turning_radius: 0.0     # 保留原地转向
 wheelbase: 0.175
 cmd_angle_instead_rotvel: False

 footprint_model:
   type: "circular"
   radius: 0.15

 xy_goal_tolerance: 0.2
 yaw_goal_tolerance: 0.3     #  放宽，到点不再原地硬调
 free_goal_vel: False

 min_obstacle_dist: 0.10
 inflation_dist: 0.15
 include_costmap_obstacles: True
 costmap_obstacles_behind_robot_dist: 0.5
 obstacle_poses_affected: 15
 costmap_converter_plugin: ""

 no_inner_iterations: 5
 no_outer_iterations: 4
 penalty_epsilon: 0.1
 weight_max_vel_x: 2
 weight_max_vel_theta: 1
 weight_acc_lim_x: 1
 weight_acc_lim_theta: 1
 weight_kinematics_nh: 1000
 weight_kinematics_forward_drive: 1    #  10 -> 1，减轻强制前向拉扯
 weight_optimaltime: 1
 weight_obstacle: 50
 weight_inflation: 0.1
 weight_adapt_factor: 2

 enable_homotopy_class_planning: False
 enable_multithreading: False
