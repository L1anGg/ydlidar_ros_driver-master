# L1angLocalPlanner 参数（对应原 scripts/l1ang_planner.py 中的常量）
# 命名空间必须是插件类名的最后一段，与 move_base 加载插件时使用的名字一致。
L1angLocalPlanner:
  # ===== 路径抽稀 =====
  dp_threshold: 0.15        # Douglas-Peucker 阈值 (m)，原 THRESHOLD

  # ===== 控制参数 =====
  yaw_kp: 0.5               # 转向比例系数
  dist_kp: 0.5              # 前进比例系数
  max_v: 0.25               # 最大线速度 (m/s)，原 Python 为 0.3，这里与 dwa 配置的 max_vel_x 一致
  max_w: 1.0                # 最大角速度 (rad/s)
  yaw_tol: 0.25             # 朝向容差 (rad)，超过则原地转向
  dist_tol: 0.10            # 到达拐点容差 (m)

  # ===== 安全 =====
  stop_dist: 0.15           # 正前方障碍小于该距离则急停 (m)
  scan_topic: scan
  scan_span_deg: 30.0       # 只检查正前方 ±该角度 (度)

  # ===== 到点判定 =====
  # 注意: xy_goal_tolerance 必须大于 dist_tol，否则永远判定不到点
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.25
  latch_xy_goal_tolerance: true
